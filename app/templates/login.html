{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body text-center">
                <h2 class="mb-1">AgendaPatinha</h2>
                <p class="text-muted mb-4">Pet Shop Patinha</p>
                
                <form method="POST">
                    <div class="mb-3 text-start">
                        <label class="form-label">Usuário</label>
                        <input type="text" name="usuario" class="form-control form-control-lg" required>
                    </div>
                    <div class="mb-3 text-start">
                        <label class="form-label">Senha</label>
                        <input type="password" name="senha" class="form-control form-control-lg" required>
                    </div>
                    <button type="submit" class="btn btn-success btn-lg w-100">Entrar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
